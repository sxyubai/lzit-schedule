org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ⚠️ 必须关掉 Kotlin 增量编译：
# pub 缓存在 C:\Users\...\Pub\Cache，项目在 D:\，Kotlin 增量编译器不允许源文件跨盘符
# （RelocatableFileToPathConverter 抛 "this and base files have different roots"），
# 导致增量缓存关闭失败、构建死锁卡住。
kotlin.incremental=false
kotlin.incremental.android=false

# Kotlin 编译改为进程内执行（不用独立 daemon）：
# 实测本机构建会僵死在 Kotlin 编译"完成之后"（日志显示两个会话都 Done with result 0，
# 但 Gradle 再也不推进），怀疑 Kotlin daemon 与 Gradle daemon 之间的通信/退出握手卡住。
# 进程内执行可完全绕开 daemon 通信。
kotlin.compiler.execution.strategy=in-process

# 关掉配置缓存，减少一层不可见的缓存交互
org.gradle.configuration-cache=false
org.gradle.caching=false

# ⚠️ 统一子项目（插件）的 JVM 目标。
# 某些插件（实测 flutter_timezone）自带 Kotlin Gradle Plugin，其 Java 目标为 11、
# Kotlin 目标为 1.8，Release 构建编译该插件时直接报
# "Inconsistent JVM-target compatibility detected for tasks
#  'compileReleaseJavaWithJavac' (11) and 'compileReleaseKotlin' (1.8)"。
# 这里在全局强制统一到 17。
kotlin.jvm.target.validation.mode=warning

# ⚠️ 关于 Gradle 代理（默认**不启用**）
#
# 背景：Flutter 引擎的 Android 二方库托管在 storage.googleapis.com/download.flutter.io，
# 国内直连约 94 KB/s，而 Gradle 下载无超时 → 首次构建会卡在 "Downloading ..." 不动。
#
# 教训（2026-10-10 实测）：**不要在这里写死代理**。
# 一旦 `systemProp.*.proxyHost` 指向本地梯子（如 127.0.0.1:7892），
# 梯子一关，**所有** Gradle 下载都会走死代理并失败：
#     Connect to 127.0.0.1:7892 failed: Connection refused
#     Could not GET https://dl.google.com/.../core-1.18.0.pom
# 结果就是"梯子没开 = 完全不能构建"，非常脆弱。
#
# 正确策略：
#   1) 默认靠**阿里云镜像**（见 android/settings.gradle.kts 的 pluginManagement）
#      覆盖 google()/mavenCentral()，绝大多数依赖不需要梯子；
#   2) 只有**首次**需要下 Flutter 引擎库时，才临时开梯子（下完就有本地缓存）；
#   3) 真要临时走代理，用命令行参数而不是写死在这里：
#        flutter build apk --release -Pproxy=1
#      或临时加下面 4 行、构建完删掉。
#
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7892
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7892
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.tencent.com
